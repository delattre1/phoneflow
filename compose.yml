services:
  agent:
    build: .
    env_file: ${PLOW_CREDENTIALS:-./plow-credentials}
    ports:
      - "0.0.0.0:8788:8787"
    environment:
      AGENT_ID: phoneflow
      PHONEFLOW_DRIVER: latch
      # agent.task nodes need this; graph-only workflows run without it.
      PHONEFLOW_LLM_API_KEY: ${PHONEFLOW_LLM_API_KEY:-}
      PHONEFLOW_LLM_BASE_URL: ${PHONEFLOW_LLM_BASE_URL:-https://ollama.com/v1}
      PHONEFLOW_AGENT_MODEL: ${PHONEFLOW_AGENT_MODEL:-glm-5.3-flash}
      PHONEFLOW_GROUNDER_MODEL: ${PHONEFLOW_GROUNDER_MODEL:-qwen3.5:397b}
      GATEWAY_ALLOW_ALL_USERS: ${GATEWAY_ALLOW_ALL_USERS:-true}
      GATEWAY_DM_POLICY: ${GATEWAY_DM_POLICY:-open}
    volumes:
      - agent-home:/var/lib/hermes
    stop_grace_period: 35s

volumes:
  agent-home:
