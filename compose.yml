services:
  agent:
    build: .
    env_file: ${PLOW_CREDENTIALS:-./plow-credentials}
    ports:
      - "0.0.0.0:8788:8787"
    environment:
      AGENT_ID: phoneflow-agent
      PHONEFLOW_DRIVER: latch
      # Optional. Empty, the planner uses the agent's own Plow model credits
      # (PLOW_API_BASE with the agent token, same as the chat agent). Set a key
      # to bring your own OpenAI-compatible endpoint instead.
      PHONEFLOW_LLM_API_KEY: ${PHONEFLOW_LLM_API_KEY:-}
      PHONEFLOW_LLM_BASE_URL: ${PHONEFLOW_LLM_BASE_URL:-}
      PHONEFLOW_AGENT_MODEL: ${PHONEFLOW_AGENT_MODEL:-glm-5.3}
      PHONEFLOW_GROUNDER_MODEL: ${PHONEFLOW_GROUNDER_MODEL:-qwen3.5:397b}
      GATEWAY_ALLOW_ALL_USERS: ${GATEWAY_ALLOW_ALL_USERS:-true}
      GATEWAY_DM_POLICY: ${GATEWAY_DM_POLICY:-open}
    volumes:
      - agent-home:/var/lib/hermes
    stop_grace_period: 35s

volumes:
  agent-home:
